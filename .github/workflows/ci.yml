name: CI

on:
  push:
  pull_request:

jobs:
  build-test-and-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run build
      - run: docker build -t adglobal-be-assignment:${{ github.sha }} .
